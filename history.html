<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บ้านกัปตัน — ประวัติบิล</title>
  <meta name="theme-color" content="#1B6B78">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="บ้านกัปตัน">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <span class="brand"><img src="icon.svg" alt="โลโก้"> บ้านกัปตัน</span>
    <nav>
      <a href="index.html">ออกบิล</a>
      <a href="history.html" class="active">ประวัติ</a>
      <a href="settings.html">ตั้งค่า</a>
    </nav>
  </header>

  <div class="container">
    <div class="toolbar">
      <input type="text" id="search" placeholder="🔍 ค้นหาชื่อร้าน / เลขที่บิล" autocomplete="off">
    </div>
    <div class="filter-chips" id="filter-chips">
      <button class="chip active" data-filter="all">ทั้งหมด</button>
      <button class="chip" data-filter="delivery">ใบส่งของ</button>
      <button class="chip" data-filter="receipt">ใบเสร็จ</button>
    </div>

    <div id="bill-list" style="margin-top:14px;"></div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/api.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
