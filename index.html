<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>บ้านกัปตัน — ออกบิล</title>
  <meta name="theme-color" content="#1B6B78">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="บ้านกัปตัน">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <span class="brand"><img src="icon.svg" alt="โลโก้"> บ้านกัปตัน</span>
    <nav>
      <a href="index.html" class="active">ออกบิล</a>
      <a href="history.html">ประวัติ</a>
      <a href="settings.html">ตั้งค่า</a>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <p class="section-label">ประเภทเอกสาร</p>
      <div class="doc-toggle" id="doc-toggle">
        <button type="button" data-type="delivery" class="active">ใบส่งของ</button>
        <button type="button" data-type="receipt">ใบเสร็จรับเงิน</button>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label for="shop">ร้านค้า</label>
        <input type="text" id="shop" list="shops-list" placeholder="เลือกหรือพิมพ์ชื่อร้านใหม่" autocomplete="off">
        <datalist id="shops-list"></datalist>
      </div>
      <div class="field">
        <label for="bill-date">วันที่</label>
        <input type="date" id="bill-date">
      </div>
    </div>

    <div class="card">
      <h2>รายการสินค้า</h2>
      <div class="items-head">
        <span>รายการ</span>
        <span class="r">จำนวน</span>
        <span class="r">ราคา/หน่วย</span>
        <span class="r">รวม</span>
        <span></span>
      </div>
      <div id="items-container"></div>
      <button type="button" class="btn btn-add" id="btn-add-item">+ เพิ่มรายการ</button>
      <datalist id="products-list"></datalist>
    </div>

    <div class="total-bar">
      <span class="lbl">รวมทั้งสิ้น</span>
      <span class="val" id="grand-total">฿0.00</span>
    </div>

    <div class="save-bar">
      <button type="button" class="btn btn-primary" id="btn-save">💾 บันทึก & พิมพ์</button>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/api.js"></script>
  <script src="js/bill.js"></script>
</body>
</html>
