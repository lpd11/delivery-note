<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บ้านกัปตัน — ตั้งค่า</title>
  <meta name="theme-color" content="#1B6B78">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="บ้านกัปตัน">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <span class="brand"><img src="icon.svg" alt="โลโก้"> บ้านกัปตัน</span>
    <nav>
      <a href="index.html">ออกบิล</a>
      <a href="history.html">ประวัติ</a>
      <a href="settings.html" class="active">ตั้งค่า</a>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <h2>ข้อมูลหัวบิล</h2>
      <p class="section-label" style="margin-bottom:14px;">ข้อมูลนี้จะขึ้นบนหัวใบส่งของและใบเสร็จทุกใบ</p>

      <div class="field">
        <label for="storeName">ชื่อร้าน / แบรนด์</label>
        <input type="text" id="storeName" placeholder="บ้านกัปตัน">
      </div>
      <div class="field">
        <label for="tagline">คำโปรย (ใต้ชื่อร้าน)</label>
        <input type="text" id="tagline" placeholder="ขนมโฮมเมด · เบเกอรี่">
      </div>
      <div class="field">
        <label for="phone">เบอร์โทรศัพท์</label>
        <input type="tel" id="phone" placeholder="08X-XXX-XXXX">
      </div>

      <div class="field">
        <label>โลโก้ร้าน</label>
        <div style="display:flex;gap:14px;align-items:center;">
          <div class="logo-preview"><img id="logo-img" src="icon.svg" alt="โลโก้"></div>
          <div style="flex:1;">
            <input type="file" id="logo-file" accept="image/*" style="display:none;">
            <button type="button" class="btn btn-ghost" id="btn-upload" style="width:100%;margin-bottom:8px;">📷 เลือกรูปโลโก้</button>
            <button type="button" class="btn btn-danger" id="btn-remove-logo" style="width:100%;">ลบโลโก้ (ใช้รูปเริ่มต้น)</button>
          </div>
        </div>
      </div>
    </div>

    <div class="save-bar">
      <button type="button" class="btn btn-primary" id="btn-save">💾 บันทึกการตั้งค่า</button>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/api.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
